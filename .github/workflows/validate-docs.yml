name: Validate Part 1 PoE Structure

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  check-docs:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Verify docs folder exists
        run: |
          if [ ! -d "docs" ]; then
            echo "Error: /docs directory not found!"
            exit 1
          fi
          echo "Success: /docs directory exists."
          
      - name: Verify required files exist
        run: |
          if [ ! -f "docs/RaceDay_ERD.drawio.png" ]; then
            echo "Error: ERD file not found in /docs"
            exit 1
          fi
          if [ ! -f "docs/Race Day API Endpoint Plan.pdf" ]; then
            echo "Error: API Endpoint Plan not found in /docs"
            exit 1
          fi
          if [ ! -f "docs/RaceDay_Database_Script.sql" ]; then
            echo "Error: SQL script not found in /docs"
            exit 1
          fi
          echo "Success: All required files are present."
